# ===================================================================
# 1. CORE APPLICATION CONFIGURATION
# ===================================================================
spring:
  application:
    name: booking-service

  # Enable Java 21 Virtual Threads for highly concurrent operations
  threads:
    virtual:
      enabled: true

  # ===================================================================
  # 2. DATA & PERSISTENCE (MySQL & Hibernate)
  # Credentials injected via environment variables. Schema auto-validated.
  # ===================================================================
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    serialization:
      write-dates-as-timestamps: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ===================================================================
  # 3. CACHING & DISTRIBUTED LOCKS (Redis)
  # Caches user contact details and the booking TTL window.
  # ===================================================================
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  # ===================================================================
  # 4. MESSAGING & EVENT STREAMING (RabbitMQ & Cloud Stream)
  # Message broker for async event publishing and consumption.
  # Naming convention: {functionName}-in-0 (consumers), -out-0 (producers).
  # ===================================================================
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}

  cloud:
    function:
      definition: paymentSucceeded;paymentFailed

    stream:
      bindings:
        # --- Outbound: booking-service -> notification-service / event-service ---
        bookingConfirmed-out-0:
          destination: booking.confirmed
          group: booking-confirmed-group
        bookingFailed-out-0:
          destination: booking.failed
          group: booking-failed-group
        seatsRelease-out-0:
          destination: seats.release
          group: seats-release-group
        bookingPaymentInitiated-out-0:
          destination: booking.payment.initiated
          group: booking-payment-initiated-group
        bookingExpired-out-0:
          destination: booking.expired
          group: booking-expired-group

        # --- Inbound: payment-service -> booking-service ---
        paymentSucceeded-in-0:
          destination: payment.succeeded
          group: booking-payment-succeeded-group
        paymentFailed-in-0:
          destination: payment.failed
          group: booking-payment-failed-group

      # Dead Letter Queue (DLQ) Configuration for RabbitMQ Bindings
      rabbit:
        bindings:
          paymentSucceeded-in-0:
            consumer:
              auto-bind-dlq: true
              dlq-ttl: 60000
          paymentFailed-in-0:
            consumer:
              auto-bind-dlq: true
              dlq-ttl: 60000

# ===================================================================
# 5. SERVICE DISCOVERY (Eureka)
# Registers with Eureka server so other services can locate it by name.
# ===================================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8080/eureka}
  instance:
    prefer-ip-address: true


# ===================================================================
# 6. LOMBOK CONFIGURATION
# Configure Lombok to preserve custom annotations like @Qualifier
# ===================================================================
lombok:
  copyableAnnotations: org.springframework.beans.factory.annotation.Qualifier

# ===================================================================
# 7. API DOCUMENTATION (SpringDoc / Swagger)
# Available at /swagger-ui.html. Grouped for multi-service clarity.
# ===================================================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ===================================================================
# 8. OBSERVABILITY & LOGGING
# DEBUG level for this service package to aid local development.
# Set to INFO in production profile.
# ===================================================================
logging:
  level:
    com.tbs.bookingservice: DEBUG
    org.springframework.cloud.stream: DEBUG