# =============================================================
# APPLICATION
# Service identity and port configuration
# =============================================================
spring:
  application:
    name: booking-service
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
  cloud:
    function:
      definition: paymentSucceeded;paymentFailed
    stream:
      bindings:
        # --- Outbound: booking-service → notification-service / event-service ---
        bookingFailed-out-0:
          destination: booking.failed
          group: booking-failed-group
        seatsRelease-out-0:
          destination: seats.release
          group: seats-release-group
        bookingPaymentInitiated-out-0:
          destination: booking.payment.initiated
          group: booking-payment-initiated-group
        bookingExpired-out-0:
          destination: booking.expired
          group: booking-expired-group
        # --- Inbound: payment-service → booking-service ---
        paymentSucceeded-in-0:
          destination: payment.succeeded
          group: booking-payment-succeeded-group
        paymentFailed-in-0:
          destination: payment.failed
          group: booking-payment-failed-group
      rabbit:
        bindings:
          bookingFailed-out-0:
            consumer:
              auto-bind-dlq: true
              dlq-ttl: 60000
          seatsRelease-out-0:
            consumer:
              auto-bind-dlq: true
              dlq-ttl: 60000
          bookingPaymentInitiated-out-0:
            consumer:
              auto-bind-dlq: true
              dlq-ttl: 60000
          bookingExpired-out-0:
            consumer:
              auto-bind-dlq: true
              dlq-ttl: 60000
          paymentSucceeded-in-0:
            consumer:
              auto-bind-dlq: true
              dlq-ttl: 60000
          paymentFailed-in-0:
            consumer:
              auto-bind-dlq: true
              dlq-ttl: 60000

# =============================================================
# DATASOURCE
# MySQL connection settings — credentials injected via environment
# variables in production. Schema auto-validated on startup.
# =============================================================

# =============================================================
# REDIS
# Used for caching and distributed locking.
# booking-service: caches user contact details and booking TTL window
# event-service: caches fixture/event data and manages seat lock keys
# =============================================================

# =============================================================
# RABBITMQ AND SPRING CLOUD STREAM
# RabbitMQ is the message broker for all async event publishing
# and consumption in this service. Spring Cloud Stream functional
# model is used — bindings are declared below per function bean name.
# Naming convention: {functionName}-in-0 for consumers,
# {functionName}-out-0 for producers.
#TODO: Left to manage DLQ.
# =============================================================

# =============================================================
# EUREKA
# Service discovery registration. This service registers itself
# with the Eureka server so other services can locate it by name.
# =============================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8080/eureka}
  instance:
    prefer-ip-address: true

# =============================================================
# SPRINGDOC / SWAGGER
# API documentation available at /swagger-ui.html
# Grouped by service name for multi-service documentation clarity.
# =============================================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# =============================================================
# LOGGING
# DEBUG level for this service package to aid local development.
# Set to INFO in production profile.
# =============================================================
logging:
  level:
    com.tbs.bookingservice: DEBUG
    org.springframework.cloud.stream: DEBUG